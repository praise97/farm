name: roots
description: Roots — Farm management for livestock, equipment, crops & more.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.3.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.3
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  uuid: ^4.5.1

  fl_chart: ^0.70.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^18.0.1
  pdf: ^3.11.3
  printing: ^5.14.2
  csv: ^6.0.0
  excel: ^4.0.6
  url_launcher: ^6.3.1
  collection: ^1.19.1
  equatable: ^2.0.7
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
